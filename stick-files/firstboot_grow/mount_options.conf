# udisks2-Treiberwahl: NTFS immer über ntfs-3g (FUSE), nie über ntfs3 (Kernel).
#
# Ziel auf dem Stick: /etc/udisks2/mount_options.conf
# (namensgleiche Repo-Pflege-Quelle, s. INSTALL.md).
#
# WARUM: Der Kernel-Treiber ntfs3 (6.12) hat in diesem Projekt ohne
# erkennbaren Anlass Datenkorruption verursacht (MFT-Schaden, Partition
# erscheint leer). ntfs-3g (Tuxera, FUSE) gilt als langsamer, aber stabil.
#
# Die fstab mountet die Datenpartition /mnt/daten bereits selbst mit
# ntfs-3g (s. MOUNT_HAERTUNG.md). Diese Datei deckt den ZWEITEN Weg ab:
# Steckt der gebootete Stick in einem Rechner und der Nutzer oeffnet im
# Dateimanager eine INTERNE NTFS-Platte dieses Rechners, mountet der
# Desktop-Automounter (udisks2) sie per Default mit ntfs3. Diese Datei
# zwingt udisks2 systemweit auf ntfs-3g.
#
# ntfs_drivers (PLURAL -- ntfs_driver ohne s wirkt NICHT) ist die
# Treiber-Praeferenzliste von udisks2. Default ist "ntfs3,ntfs"; der Wert
# "ntfs" (ohne 3) ist udisks' interner Name fuer den ntfs-3g-FUSE-Treiber.
# Nur "ntfs" setzen => udisks2 nimmt fuer ALLE NTFS-Automounts ntfs-3g.
#
# Reversibel: Datei loeschen => Default (ntfs3 zuerst) kehrt zurueck.

[defaults]
ntfs_drivers=ntfs
